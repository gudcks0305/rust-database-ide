[package]
name = "dbide-result-store"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
arc-swap = "1"
dbide-driver-api = { path = "../dbide-driver-api" }
dbide-export = { path = "../dbide-export" }
dbide-pg-spike = { path = "../dbide-pg-spike" }
dbide-profiles = { path = "../dbide-profiles" }
dbide-project = { path = "../dbide-project" }
serde = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }
