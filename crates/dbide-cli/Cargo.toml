[package]
name = "dbide-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "dbide"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dbide-bridge = { path = "../dbide-bridge" }
dbide-catalog-store = { path = "../dbide-catalog-store" }
dbide-credentials = { path = "../dbide-credentials" }
dbide-data = { path = "../dbide-data" }
dbide-driver-api = { path = "../dbide-driver-api" }
dbide-profiles = { path = "../dbide-profiles" }
dbide-project = { path = "../dbide-project" }
dbide-settings = { path = "../dbide-settings" }
dbide-sql = { path = "../dbide-sql" }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
