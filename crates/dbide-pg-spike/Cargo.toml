[package]
name = "dbide-pg-spike"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
dbide-driver-api = { path = "../dbide-driver-api" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
sha2 = "0.10"
sqlparser = { version = "=0.63.0", features = ["visitor"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-postgres = "0.7.15"

dbide-profiles = { path = "../dbide-profiles" }
native-tls = "0.2"
postgres-native-tls = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
