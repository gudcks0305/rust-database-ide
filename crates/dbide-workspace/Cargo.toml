[package]
name = "dbide-workspace"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
dbide-profiles = { path = "../dbide-profiles" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
