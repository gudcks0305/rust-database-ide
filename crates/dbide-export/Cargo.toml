[package]
name = "dbide-export"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
dbide-data = { path = "../dbide-data" }
dbide-profiles = { path = "../dbide-profiles" }
dbide-project = { path = "../dbide-project" }
dbide-sqlite = { path = "../dbide-sqlite" }
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }
serde_json = "1"
