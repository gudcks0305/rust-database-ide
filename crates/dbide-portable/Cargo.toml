[package]
name = "dbide-portable"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
dbide-profiles = { path = "../dbide-profiles" }
dbide-settings = { path = "../dbide-settings" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
